publish-nightly:
    name: Publish Nightly Release
    needs: [desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # <-- INDISPENSABLE pour créer/modifier des releases
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download all 4 platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: HookyCreator-*
          path: nightly-artifacts

      - name: Assemble installers and generate SHA256SUMS.txt
        run: python tools/assemble_beta_release.py --artifacts nightly-artifacts --output nightly-dist

      - name: Replace existing 'night' release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="night"
          BUILD_DATE=$(date -u +'%Y-%m-%d %H:%M:%S UTC')
          
          # Supprimer proprement l'ancienne release et le tag s'ils existent (sans crasher si absents)
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          
          # Créer la nouvelle release propre avec les binaires du jour
          gh release create "$TAG" nightly-dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "HookyMod Nightly 🌙" \
            --prerelease \
            --notes "Automated nightly build generated from \`main\`.
          - **Commit:** \`${GITHUB_SHA}\`
          - **Date:** ${BUILD_DATE}
          - **Checksums:** Verify downloads against \`SHA256SUMS.txt\`."
