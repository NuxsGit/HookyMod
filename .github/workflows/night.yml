name: Nightly Release

on:
  push:
    branches: [ "main" ]

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies & Build
        run: |
          npm ci
          npm run build --if-present

      # ==========================================
      # AJOUTE ICI TON ÉTAPE DE BUILD / PACKAGING 
      # (Exemple si tu utilises Tauri ou un bundler)
      # ==========================================
      # - name: Build App Installers
      #   run: npm run tauri build # ou la commande spécifique de ton projet
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove existing Nightly Tag & Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="night"
          git push origin --delete $TAG || true
          gh release delete $TAG --yes || true
          git tag -d $TAG || true

      - name: Create Nightly Release & Upload Assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "night"
          name: "Nightly Build 🌙"
          body: |
            Automated nightly build derived from the latest changes on `main`.
            
            * Commit: `${{ github.sha }}`
            * Date: $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          draft: false
          prerelease: true
          # C'est ici que tu indiques les chemins vers tes installateurs générés :
          files: |
            dist/*
            # Si tu utilises Tauri, les binaires se trouvent généralement dans :
            # src-tauri/target/release/bundle/nsis/*.exe
            # src-tauri/target/release/bundle/deb/*.deb
            # src-tauri/target/release/bundle/dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
