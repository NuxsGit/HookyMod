name: HookyCreator desktop

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Tauri v2 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            extension: ''
            bundle: deb
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            extension: .exe
            bundle: nsis
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.0'
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            src-tauri
      - name: System libraries and WebKit WebDriver
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev librsvg2-dev patchelf webkit2gtk-driver xvfb gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      - name: Microsoft Edge WebDriver matching WebView2
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # WebView2 est indépendant du navigateur Edge : le driver préinstallé
          # par le runner peut viser une version majeure complètement différente.
          $id = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $keys = @("HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$id",
                    "HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\$id",
                    "HKCU:\SOFTWARE\Microsoft\EdgeUpdate\Clients\$id")
          $version = $null
          foreach ($key in $keys) {
            $candidate = (Get-ItemProperty -Path $key -Name pv -ErrorAction SilentlyContinue).pv
            if ($candidate -match '^\d+\.\d+\.\d+\.\d+$' -and $candidate -ne '0.0.0.0') {
              $version = $candidate
              break
            }
          }
          if (-not $version) { throw 'Version du runtime WebView2 introuvable' }
          $major = $version.Split('.')[0]
          $driverVersion = (Invoke-RestMethod "https://msedgedriver.microsoft.com/LATEST_RELEASE_$major").Trim()
          if ($driverVersion -notmatch "^$major\.\d+\.\d+\.\d+$") { throw 'Version du WebDriver invalide' }
          $directory = Join-Path $env:RUNNER_TEMP 'webview2-driver'
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          $archive = Join-Path $directory 'driver.zip'
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$driverVersion/edgedriver_win64.zip" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $directory -Force
          $driver = Join-Path $directory 'msedgedriver.exe'
          if (-not (Test-Path $driver)) { throw 'WebDriver téléchargé introuvable' }
          Write-Host "WebView2 $version ; WebDriver $driverVersion"
          "HOOKY_WEBDRIVER_BINARY=$driver" >> $env:GITHUB_ENV
      - name: Python and Tauri build dependencies
        run: |
          python -m pip install -r requirements-desktop-build.txt
          npm ci
      - name: Build standalone sidecar including Rust core
        run: python .github/scripts/run_ci_command.py -- python tools/build_desktop_backend.py
      - name: Smoke test the standalone sidecar
        run: python .github/scripts/run_ci_command.py -- python tools/smoke_desktop_backend.py src-tauri/binaries/hookycreator-backend-${{ matrix.target }}${{ matrix.extension }}
      - name: Format and test Tauri Rust
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          python .github/scripts/run_ci_command.py -- cargo test --manifest-path src-tauri/Cargo.toml
      # Temporaire : récupérer le lock généré par ce premier build pour le versionner.
      - name: Record Tauri dependency lock
        if: runner.os == 'Linux'
        run: |
          python -c 'from pathlib import Path; import base64,zlib; s=base64.b64encode(zlib.compress(Path("src-tauri/Cargo.lock").read_bytes(),9)).decode(); [print("::notice title=Cargo-lock-%02d::%s" % (i,s[12000*i:12000*(i+1)])) for i in range((len(s)+11999)//12000)]'
      - name: Build real app for WebDriver
        run: python .github/scripts/run_ci_command.py -- npm run tauri -- build --debug --no-bundle
      - name: Install tauri-driver
        run: python .github/scripts/run_ci_command.py -- cargo install tauri-driver --locked
      - name: Exercise WebKitGTK window and downloads
        if: runner.os == 'Linux'
        run: xvfb-run -a python .github/scripts/run_ci_command.py -- python tools/smoke_desktop_webview.py
      - name: Exercise WebView2 window and downloads
        if: runner.os == 'Windows'
        run: python .github/scripts/run_ci_command.py -- python tools/smoke_desktop_webview.py
      - name: Build native installer
        run: python .github/scripts/run_ci_command.py -- npm run tauri -- build --bundles ${{ matrix.bundle }}
      - name: Keep test installer
        uses: actions/upload-artifact@v4
        with:
          name: HookyCreator-${{ matrix.os }}
          path: src-tauri/target/release/bundle/${{ matrix.bundle }}/
          if-no-files-found: error
          retention-days: 14

  blender:
    name: Export avec Blender réel / Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Blender and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          python -m pip install -r requirements.txt pytest pillow
      - name: Create and reopen a real blend
        run: python .github/scripts/run_ci_command.py -- python -m pytest -q tests/test_real_blender.py
